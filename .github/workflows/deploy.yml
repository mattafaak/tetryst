name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
      - name: Create deployment entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_ID=$(jq -nc \
            --arg ref "${{ github.sha }}" \
            '{ref: $ref, environment: "github-pages", auto_merge: false, required_contexts: [], description: "Deploy to GitHub Pages"}' \
            | gh api --method POST repos/${{ github.repository }}/deployments --input - --jq '.id')
          gh api \
            --method POST \
            repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses \
            -f state='success' \
            -f environment_url='https://mattafaak.github.io/tetryst/' \
            -f description='Deployment successful'
