name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to gh-pages branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin gh-pages 2>/dev/null || true
          # Save dist to temp, then rebuild working tree on orphan branch
          cp -r dist /tmp/gh-pages-dist
          touch /tmp/gh-pages-dist/.nojekyll
          git checkout --orphan gh-pages-tmp
          rm -rf * .gitignore .gitattributes 2>/dev/null || true
          cp -r /tmp/gh-pages-dist/* .
          rm -rf /tmp/gh-pages-dist
          git add .
          git commit -m "deploy: $(git log -1 --format=%s origin/master)"
          git push -f origin gh-pages-tmp:gh-pages
